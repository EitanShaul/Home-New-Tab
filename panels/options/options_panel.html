<title>Options: Home New Tab page</title>

<style>
* {margin:0; padding:0;}

.fit {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
}

body {
	overflow: hidden;
	-webkit-font-smoothing: antialiased; 	
	user-select: none;
	font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans",
    "Droid Sans", "Helvetica Neue", sans-serif;

	color: rgba(0, 0, 0, .8);
}

input, button, select, textarea {
	font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans",
    "Droid Sans", "Helvetica Neue", sans-serif;
}

body, input, textarea, select, button {
  -webkit-font-smoothing: antialiased;
}

body.dark-theme {
	background: rgba(10, 10, 10, 0.93);
	color: rgba(255,255, 255, .8);
}

h1 {  line-height:60px; border-radius: 8px 8px 0 0; text-align: center;cursor:default;
	background: -webkit-gradient(
		linear,center top,center bottom,
		from(rgba(0, 0, 0, 0.038)),
		color-stop(50%,rgba(0, 0, 0, 0.058)),
		to(rgba(0, 0, 0, 0.088)));

}
h1 span {   font-weight: 500 }
h2 {  margin:30px 0 20px; cursor:default; font-size:26px; }
label { font-size:16px; font-weight: bold; display: block; margin:10px 0;}
select { 
	font-weight: bold;  margin-left:15px; width:120px; 
  font-weight: 500
}
/*
.win select { background: rgba(255,255,255,.4); border: .5px solid #aaa;  }
.mac select { background: rgba(255,255,255,.55);  border: 1px solid #aaa;  }
*/
.win select, .win button {border-width: .5px;  }
select, input { font-size:16px;}
input { margin-right: 8px; }

#default-background {font-weight: 500; margin-left: -2px;}

.pulltop {margin-top:0}

.options { /*background:rgba(235, 235, 235, 0.89); border-radius: 8px; box-shadow: 0 10px 20px rgba(0, 0, 0, .25); */
 box-sizing:border-box;  z-index:10; /*-webkit-transform:translate3d(0, 1000px, 0); -webkit-transition:-webkit-transform 1s; */ }
.options-content { padding:20px 40px 30px; }
.option-name { width:130px; display:inline-block;}
.options-wrapper { 
	width: 100%; position: absolute; z-index: 100;
    overflow: auto;
    right: 3px;
    top: 4px;
    bottom: 4px;
    height: auto;
}


button { font-size:14px; padding:2px 0; width:93px; display:block; clear:both; }

#options-note, #options-please {  width:100%; text-align: center;  left: 0; }
#options-note {  font-size:13px; color:rgba(0,0,0,.55); margin-top: 40px; font-weight: 500;  }
#options-please { font-size:18px; bottom:40px; margin:20px 0 0; line-height: 1.4; border-top: 1px solid rgba(0,0,0,.08); padding-top: 10px; font-weight: 600;  }
#options-please i { font-weight: 500; }
#background-option-right { vertical-align: top; }
#background-option-left { float:left; margin-right:20px; }
#background-option img { border-radius:3px; }
a { /*color:#c31000;*/  color:#007CE4;  }
#background-option-right select { width:93px; margin:0; } 
input[type="checkbox"] { -webkit-transform: scale(1.5); zoom: 1.01;  position: relative; }

html.win input[type="checkbox"] { top: 2px; }
html.mac input[type="checkbox"] { top: 0.5; }

h1 { display:none; }


#search-survey-wrapper label { font-weight: normal; }

*/

    font-size: 11px;

    text-align: center;
  }

  	 width: 76px; 
  	 height: 28px;
  	 margin-top: 10px;
  }
  #twitter-widget-0 {  margin-top: 10px; right: 0; }

  #backup { 
  	font-size:0; 
  	width: 390px;
  }
  #backup button {
  	display: inline-block;
    width: auto;
    padding: 4px 30px;
    font-size: 20px;
    /*margin-right: 20px;*/

    width: calc(50% - 7px);
    padding: 0;
  }

  #backup-export {
  	margin-right: 14px;
  }
  #backup-export, #backup-import {
  	height: 1.7em;
  }

/**
 * Scrollbar
 */
::-webkit-scrollbar {
	width: 9px;
}

::-webkit-scrollbar-thumb {
	/*background: rgba(0, 0, 0, 0.6);
  box-shadow: inset 0 0 1px rgba(255,255,255,1);
  background-color: white;*/
  /*box-shadow: inset 0 0 1px rgba(0,0,0,0.5);
  background-color: rgba(255,255,255,.5);*/
  box-shadow: inset 0 0 1px rgba(0,0,0,0.5);
  background-color: #aaa;
  background-color: rgba(0,0,0,.25);
  border-radius: 8px;
}

::-webkit-scrollbar-track {
	/*
	background-color: rgba(100, 100, 100, .8);
	border-left: 2px solid rgba(255,255,255,.05);
	*/
	/*background-color: rgba(0, 0, 0, .4);*/

}

#close {
	position: fixed;
	right: 28px;
	top: 12px;
	z-index: 101;
	font-size: 30px;
	color: #666;
	cursor:pointer;
	top: 20px;

	display:none;
}

#backup #backup-auto {
	margin: 14px 0 0;
	padding: 6px 10px;
	display: block;
	line-height: 1em;
	/*border: .5px solid #aaa;
	background: rgb(233, 233, 233);*/
	width: 383px;
	box-sizing: border-box;
  outline:none;

  width: 100%;
}

#backup #backup-auto:active {
	background: rgb(180, 180, 180);
}
*/

#backup #backup-auto .title {
	font-size: 18px;
}

#backup #backup-auto .details {
	font-size: 11px;
	color: #666;
	display: block;
}

button, select {
	background: rgba(255,255,255,.60);
	border: 1px solid rgba(0,0,0,.25);
	border-radius: 4px;
	outline:none;
}
button:active {
	background: rgba(200,200,200,.90);
}

#background_image {
	width: 260px;
}

#background-preview {
	transition: opacity .4s ease;
}

#background-preview-wrapper {
	width: 90px;
	height: 90px;
	float: left;
	margin-bottom: 6px;
}

.loading {
	background: url(/img/loading.gif) no-repeat center center;
}

.loading > #background-preview  {
	opacity: 0.25; 
}


label.disabled {
	color: #777; 
}
.disabled-info {
	color: #999; 
	font-size: 70%;
	margin-top: 5px; 
	float: right;
}
.disabled-info {display:none}
label.disabled .disabled-info { display: block; }

#right-buttons {

}

#help-button-wrapper {
	text-align: right;
	margin-bottom: 28px;
	top: 4px;
	font-size: 12px;
	right: 20px;
	position: relative;
	display: none;
}
#help-button {
	text-decoration: none;
	color: rgba(0, 0, 0, .8);
	background: rgba(255,255,255,.4);
	display: inline-block;
	padding: 3px 16px;
	border: 1px solid #aaa;
	border-radius: 3px;
}
#help-button:hover { background: rgba(255,255,255,.7); }
#help-button:active { background: rgba(0,0,0,.1); }

#right-buttons {
	width: 147px;
	position: absolute;
	right: 4px;
}
hr {
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #f0f0f0;
    border-bottom: 0;
}
#appearance hr { width: 40%; margin-top: 14px; }

			<h2 class="pulltop">General</h2>

			<label><div class="option-name">Temperature</div> <select id="temperature"><option value="c">°C</option><option value="f">°F</option></select></label>
			<label title="How often to check for notifications"><div class="option-name" title="How often to check for notifications">Fetch interval</div>
				<select id="fetch_interval" title="How often to check for notifications"><option value="1">1m</option><option value="5">5m</option><option value="15">15m</option><option value="30">30m</option></select>
			</label>
			<label title="Where to open clicked apps on homepage"><div class="option-name">Open App Tab</div> <select id="app_opener_tab"><option value="current">Current</option><option value="new_background">Background</option><option value="new_active">New Active</option></select></label>
      <label title="Automatically dim your homepage at night"><div class="option-name">Darker At Night</div> <select id="dim_at_night"><option value="true">Yes</option><option value="false">No</option></select></label>
      

			<h2>Background</h2>
			<div id="background-option">
				<div id="background-option-left">
					<span id="background-preview-wrapper">
						<img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" id="background-preview" width="100%" height="100%" />
					</span>
					<button id="default-background">Default</button>
				</div>
				<div id="background-option-right">
					<input type="file" id="background_image" accept="image/*" /> <br/><br/>		
					<select id="background_style">
						<option value="tile">Tile</option>
						<option value="fill">Fill</option>
						<option value="stretch">Stretch</option>
					</select>
					<label title="Darken edges of the screen (vignette)"><input type="checkbox" id="background_gradient" /> Shadow effect</label>
					<label title="Turn this Off, if you have a slow computer"><input type="checkbox" id="background_fadein" /> Fade-in animation <div class="disabled-info">(turned off, your computer seems slow)</div></label>
				</div>
			</div>

			<h2>Backup</h2>
			<div id="backup">
					<button id="backup-export">Export to File</button>
					<button id="backup-import">Import from File</button>
					<input type="file" id="backup-import-file" style="display:none" />
					<button id="backup-auto">
						<span class="title">Restore from Automatic Backup</span>
						<span class="details">
							<span id="backup-auto-time">.</span>
							<span id="backup-auto-size">.</span>
						</span>
					</button>
			</div>

			<h2>Appearance</h2>
			
			<div id="appearance">

			<div style="color: #555;">LEFT TOOLBAR</div>

			<label><input type="checkbox" checked="checked" id="show_help"> Help Button</label>
			<label><input type="checkbox" checked="checked" id="show_review"> Review Button</label>
			<hr />
			<label><input type="checkbox" checked="checked" id="show_bookmarks"> Bookmarks</label>
			<label><input type="checkbox" checked="checked" id="show_notifications"> Notifications</label>
			<label><input type="checkbox" checked="checked" id="show_qnotes"> Quick Notes</label>
			<label><input type="checkbox" checked="checked" id="show_weather"> Weather</label>
			<label><input type="checkbox" checked="checked" id="show_focus"> Focus Button</label>
      <label><input type="checkbox" checked="checked" id="show_background_button"> Wallpapers button</label>

			<div style="color: #555; margin-top: 15px;">MISC</div>

			<label><input type="checkbox" checked="checked" id="show_datetime"> Date &amp; Time</label>
			<label><input type="checkbox" checked="checked" id="show_recently_closed"> Recently Closed</label>
			<label><input type="checkbox" checked="checked" id="show_daily_focus"> Daily Todo (in focus)</label>
			<label><input type="checkbox" checked="checked" id="search_bar"> Search Bar</label>

			</div>

			<h2>Notifications</h2>
			<div id="notification-options"></div>

</div> <!-- end of options -->
