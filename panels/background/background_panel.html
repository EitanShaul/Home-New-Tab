<!DOCTYPE html>
<html>
<head>
  <meta charset=utf-8 />
  <title>Change Background</title>
  <style>
  * { margin:0; padding:0; }

  	html {   	
  	/*	
  		background-color: rgba(237, 237, 237, 0.93);
  		zoom:1.25;
  		width: 540px;

  		border-left: 10px solid rgba(0,0,0,.05);
  		*/

 		}

  	html {
  	}
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans",
                   "Droid Sans", "Helvetica Neue", sans-serif;
      font-size  : 16px;
      height: 100%;
      user-select:none;
      -webkit-user-select: none;
      cursor:default;
      overflow: hidden;
      /*-webkit-font-smoothing: antialiased; */  
    }

    input, button, select, textarea {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                      "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans",
                      "Droid Sans", "Helvetica Neue", sans-serif;
    } 

    #image-slider {
      margin:0 20px;

      height: 180px;
      padding:20px;
      overflow: hidden;
      overflow-x:scroll;
      position: relative;
      /*transform: translateZ(0);*/
    }

    #image-slider-content {
      position: absolute;
      width: 10000px;
      left: 0;
    }

    #image-slider-content div {
      display: inline-block;
      transition: transform .15s ease-out;
      z-index: 1;
      margin: 0 8px;
      width: 320px;
      height: 160px;
      border:5px solid transparent;
      transform: translateZ(0); /* TEMP added to prevent flicker*/ 
      /*background-color:beige;*/
      /*border:5px solid transparent;*/
    }
    #image-slider-content img {
      background-color: #333;
      width: 320px;
      height: 160px;
      /*transition: all .15s ease-out; TEMP removed, caused flickering*/
      box-shadow: 0 0 10px #111;
    }
    #image-slider-content div:hover {
      transform: scale(1.1) translateZ(0);
    }
    #image-slider-content div:hover img {
      box-shadow: 0 0 20px #070707;
      z-index: 100;
    }
    #image-slider-content div.selected {
      border-color:rgba(255,255,255,.7);
      border-color:#FFDF00;
    }
    #image-slider-content div.selected img {
      box-shadow: none;
    }

    .daily-button {
        width: 128px;
        height: 80px;
        border:5px solid transparent;
        display: inline-block;
        margin: 0 8px;
        vertical-align: top;
        margin-top: 5px;
        background: #333;
        color: #ddd;
        border-radius: 8px;
        outline:none;
        box-shadow: 0 0 10px #111;
        transition: background .15s ease-out, transform .15s ease-out;
        transform: translateZ(0); /* TEMP added to prevent flicker*/ 
        background: rgb(77 77 77 / 50%);
      }
      .daily-button:hover {
         background: #444;
         color: #eee;
         transform: scale(1.1) translateZ(0);
         box-shadow: 0 0 20px #070707;
         z-index: 100;
         background: rgb(90 90 90 / 60%);
      }
      .daily-button:active {
        background: #111;
        color: #aaa;
      }
      .daily-button.selected {
        border-color:#FFDF00 !important;
        background: #1a1a1a;
      }
      .daily-button > span { color:#aaa; }
      .daily-button > .dots  { display:none; }
      .daily-button.selected > .dots  { display:block; }
      .daily-button > .dots > b {
        width: 4px;
        height: 4px;
        border: 1px solid #aaa;
        display: inline-block;
        border-radius: 4px;
        margin: 0 3px;
      }
      .selected > .dots > b.active {
        background: #FFDF00;
        border: 1px solid #FFDF00; /*ddd*/
        box-shadow: 0 0 5px black;
      }

      .subtitle {
        position: absolute;
        top: -16px;
        color: #999;
        text-transform: uppercase;
        font-size: 13px;
      }
      #h3-daily {left: 10px;}
      #h3-static {left: 157px;} /*left: 300px;*/

    ::-webkit-scrollbar {
      background-color: #31353a;
      background-color: transparent;
      bottom: 0;
      width: 20px;
      height: 20px; }

    ::-webkit-scrollbar-track {
      width: 10px;
      border-radius: 10px;
      background-color: #31353a; 
      background-color: rgba(0,0,0,.15); 
      background-color: rgba(255,255,255,.07);}

    ::-webkit-scrollbar-thumb {
      width: 15px;
      box-shadow: inset 0 0 1px #aaa, 0 0 10px rgba(0,0,0,.6);
      border: 2px solid transparent;
      border-left-width: 1.5px;
      background-clip: content-box;
      border-radius: 5px !important;
      background-color: #4b4f53; 
      /*background: #794E00;*/ }

    ::-webkit-scrollbar-thumb:hover {
      background-color: #54595e;
      box-shadow: inset 0 0 1px #ccc;
      box-shadow: inset 0 0 1px #aaa, 0 0 10px rgba(0,0,0,.8); }

    ::-webkit-scrollbar-thumb:active {
      background-color: #6c7177;
      box-shadow: inset 0 0 1px #fff;
      /*background: #EEB200;*/  }

  </style>

</head>
<body>  


<div id="image-slider">
  <div id="image-slider-content">
  </div>
</div>

  <script src="/js/default.js"></script>
  <script src="/js/lib/zepto.min.js"></script>
  <script src="background_panel.js"></script>
  <script src="/js/lib/filesystem.js"></script>
</body>
</html>
